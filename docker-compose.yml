services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pashu
      POSTGRES_PASSWORD: pashu
      POSTGRES_DB: pashusafe
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pashu"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pashu:pashu@db:5432/pashusafe
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ENVIRONMENT: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: /api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
